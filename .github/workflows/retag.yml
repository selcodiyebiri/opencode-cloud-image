name: retag

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t ghcr.io/selcodiyebiri/opencode-cloud:v2 ghcr.io/selcodiyebiri/opencode-cloud:latest
