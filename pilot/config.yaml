repos_dir: /root/.local/share/opencode/repos

defaults:
  agent: build
  prompt: default
  model: opencode/claude-sonnet-4-6

sources:
  - name: test-issues
    tool:
      command: ["gh", "search", "issues", "--state=open", "--repo=selcodiyebiri/oc-pilot-test", "--json", "number,title,url,repository,state,body,updatedAt"]
    item:
      id: "{url}"
    repo: "{repository.nameWithOwner}"
    worktree_name: "issue-{number}"
    session:
      name: "{title}"
